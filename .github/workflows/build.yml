name: Build MangaReader IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile MangaReader iOS App
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "Found project at: $PROJ_PATH in $PROJ_DIR"
          cd "$PROJ_DIR"
          
          xcodebuild \
            -project "$(basename "$PROJ_PATH")" \
            -target "MangaReader" \
            -configuration Release \
            -sdk iphoneos \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$GITHUB_WORKSPACE/build"

      - name: Package IPA
        run: |
          mkdir -p $GITHUB_WORKSPACE/Payload
          APP_PATH=$(find $GITHUB_WORKSPACE/build -name "MangaReader.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" $GITHUB_WORKSPACE/Payload/
          cd $GITHUB_WORKSPACE
          zip -r MangaReader.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-IPA
          path: MangaReader.ipa
