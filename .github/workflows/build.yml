name: Build MangaReader IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile MangaReader iOS App
        run: |
          xcodebuild \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -sdk iphoneos \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SYMROOT="$GITHUB_WORKSPACE/build"

      - name: Package IPA
        run: |
          mkdir -p $GITHUB_WORKSPACE/Payload
          APP_PATH=$(find $GITHUB_WORKSPACE/build -name "MangaReader.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" $GITHUB_WORKSPACE/Payload/
          cd $GITHUB_WORKSPACE
          zip -r MangaReader.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-IPA
          path: MangaReader.ipa
