name: Build MangaReader IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          cd MangaReader 2>/dev/null || true
          xcodebuild clean archive \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/MangaReader.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          cd MangaReader 2>/dev/null || true
          mkdir -p ./build/Payload
          cp -r ./build/MangaReader.xcarchive/Products/Applications/MangaReader.app ./build/Payload/
          cd ./build
          zip -r ../../MangaReader.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-IPA
          path: MangaReader.ipa
