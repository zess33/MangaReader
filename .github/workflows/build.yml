name: Build MangaReader IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Project and Build
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "Found project at: $PROJ_PATH in $PROJ_DIR"
          cd "$PROJ_DIR"
          
          xcodebuild clean archive \
            -project "$(basename "$PROJ_PATH")" \
            -scheme "MangaReader" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/build/MangaReader.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p $GITHUB_WORKSPACE/Payload
          cp -r $GITHUB_WORKSPACE/build/MangaReader.xcarchive/Products/Applications/MangaReader.app $GITHUB_WORKSPACE/Payload/
          cd $GITHUB_WORKSPACE
          zip -r MangaReader.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-IPA
          path: MangaReader.ipa
