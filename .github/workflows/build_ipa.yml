name: Build MangaReader iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15/16
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS Archive
        run: |
          xcodebuild clean archive \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/MangaReader.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p ./build/Payload
          cp -r ./build/MangaReader.xcarchive/Products/Applications/MangaReader.app ./build/Payload/
          cd ./build
          zip -r ../MangaReader.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-iOS-IPA
          path: MangaReader.ipa
