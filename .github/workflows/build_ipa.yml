name: Build MangaReader iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          DEVELOPER_DIR=$(xcode-select -p)
          echo "Using Xcode developer dir: $DEVELOPER_DIR"

      - name: Build iOS Archive
        run: |
          xcodebuild clean archive \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/MangaReader.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p ./build/Payload
          APP_PATH=$(find ./build/MangaReader.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found in archive"
            exit 1
          fi
          echo "Copying $APP_PATH to Payload..."
          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r ../MangaReader.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-iOS-IPA
          path: MangaReader.ipa

